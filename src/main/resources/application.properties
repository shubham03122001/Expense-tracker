spring.application.name=userservice

# MySQL DB configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.0.105:3306/userservice?allowPublicKeyRetrieval=true&useSSL=false

spring.datasource.username=root
spring.datasource.password=Mukaidevi@1
spring.cloud.compatibility-verifier.enabled=false

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# Server port
server.port=9820

# Kafka Configuration
spring.kafka.bootstrap-servers=192.168.0.105:9092
spring.kafka.consumer.group-id=userinfo-consumer-group
spring.kafka.topic.name=testing_json

# Correct the deserializer property names
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.springboot.userservice.deserializer.UserInfoDeserializer

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.your.package.name=DEBUG

# Prometheus Configuration
prometheus.server.port=9090
management.endpoints.web.exposure.include=metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
